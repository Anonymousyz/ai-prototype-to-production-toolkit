name: Improvement proposal
about: Suggest an improvement to the toolkit
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this improvement solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should be changed or added?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Public sources or comparable projects, if any.
