<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI Prototype-to-Production Toolkit overview</title>
  <desc id="desc">A four-stage path from AI demo to accountable workflow: review, veto gates, evidence, and human decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111c35"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity=".5"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="58" y="44" width="1084" height="542" rx="26" fill="#0f172a" stroke="#24324a"/>
  <text x="92" y="91" fill="#67e8f9" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">OPEN SOURCE · LOCAL FIRST · v0.6.0</text>
  <text x="92" y="145" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="42" font-weight="750">From AI demo to accountable workflow</text>
  <text x="92" y="181" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="20">A review surface for workflow, evidence, controls, ownership and rollback.</text>
  <path d="M299 330H358M546 330H605M793 330H852" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="92" y="235" width="207" height="190" rx="18" fill="#0b2635" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="128" cy="275" r="18" fill="#22d3ee"/><text x="128" y="282" text-anchor="middle" fill="#07111f" font-family="Segoe UI" font-size="18" font-weight="800">1</text>
    <text x="116" y="325" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="23" font-weight="700">Working demo</text>
    <text x="116" y="358" fill="#a5f3fc" font-family="Segoe UI,Arial" font-size="15">Name the workflow</text><text x="116" y="382" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="14">user · data · action</text>

    <rect x="339" y="235" width="207" height="190" rx="18" fill="#10273a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="375" cy="275" r="18" fill="#38bdf8"/><text x="375" y="282" text-anchor="middle" fill="#07111f" font-family="Segoe UI" font-size="18" font-weight="800">2</text>
    <text x="363" y="325" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="23" font-weight="700">70-point review</text>
    <text x="363" y="358" fill="#bae6fd" font-family="Segoe UI,Arial" font-size="15">Seven fixed dimensions</text><text x="363" y="382" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="14">schema · CLI · report</text>

    <rect x="586" y="235" width="207" height="190" rx="18" fill="#2b1831" stroke="#fb7185" stroke-width="2"/>
    <circle cx="622" cy="275" r="18" fill="#fb7185"/><text x="622" y="282" text-anchor="middle" fill="#2b0b14" font-family="Segoe UI" font-size="18" font-weight="800">3</text>
    <text x="610" y="325" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="23" font-weight="700">Eight veto gates</text>
    <text x="610" y="358" fill="#fecdd3" font-family="Segoe UI,Arial" font-size="15">Block unsafe handoffs</text><text x="610" y="382" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="14">owner · review · rollback</text>

    <rect x="833" y="235" width="275" height="190" rx="18" fill="#211a3b" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="869" cy="275" r="18" fill="#a78bfa"/><text x="869" y="282" text-anchor="middle" fill="#17102d" font-family="Segoe UI" font-size="18" font-weight="800">4</text>
    <text x="857" y="325" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="23" font-weight="700">Human decision</text>
    <text x="857" y="358" fill="#ddd6fe" font-family="Segoe UI,Arial" font-size="15">Pilot, revise or stop</text><text x="857" y="382" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="14">evidence stays inspectable</text>
  </g>
  <rect x="92" y="468" width="1016" height="74" rx="14" fill="#111c2e" stroke="#26364e"/>
  <text x="120" y="500" fill="#cbd5e1" font-family="Segoe UI,Arial" font-size="15" font-weight="700">What it produces</text>
  <text x="120" y="526" fill="#94a3b8" font-family="Segoe UI,Arial" font-size="15">Markdown + static HTML reports · checklists · scorecards · risk register · system card · fictional cases</text>
  <rect x="92" y="563" width="1016" height="3" rx="2" fill="url(#accent)"/>
</svg>
