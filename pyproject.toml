[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ready"
version = "0.6.0"
description = "CLI toolkit for AI prototype-to-production readiness scoring and reporting."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Anonymousyz" }]
keywords = [
  "ai-governance",
  "ai-deployment",
  "llmops",
  "responsible-ai",
  "production-readiness",
  "fde",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Anonymousyz/ai-prototype-to-production-toolkit"
Repository = "https://github.com/Anonymousyz/ai-prototype-to-production-toolkit"
Issues = "https://github.com/Anonymousyz/ai-prototype-to-production-toolkit/issues"

[project.scripts]
ai-ready = "ai_ready.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_ready = ["data/*.json"]
